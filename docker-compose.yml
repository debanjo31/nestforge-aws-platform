x-api-environment: &api-environment
  NODE_ENV: production
  PORT: 3000
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USERNAME: postgres
  DB_PASSWORD: postgres
  DB_NAME: nestforge
  DB_SSL: "false"
  DB_SSL_REJECT_UNAUTHORIZED: "true"
  JWT_SECRET: local-development-only-change-me
  JWT_EXPIRES_IN: 1h

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nestforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nestforge"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrations:
    image: nestforge-api:local
    environment: *api-environment
    command:
      [
        "node",
        "./node_modules/typeorm/cli.js",
        "-d",
        "dist/database/data-source.js",
        "migration:run",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: nestforge-api:local
    build:
      context: .
      dockerfile: Dockerfile
    environment: *api-environment
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
