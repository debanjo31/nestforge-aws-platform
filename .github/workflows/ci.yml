name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application and infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      API_DIR: nestforge-api
      TERRAFORM_DIR: api-infra-terraform
      CI_IMAGE: nestforge-api:ci-${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Enable Corepack
        working-directory: ${{ env.API_DIR }}
        run: |
          corepack enable
          pnpm --version

      - name: Locate pnpm store
        id: pnpm-store
        working-directory: ${{ env.API_DIR }}
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-22-pnpm-${{ hashFiles('nestforge-api/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-22-pnpm-

      - name: Install dependencies
        working-directory: ${{ env.API_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: ${{ env.API_DIR }}
        run: pnpm lint

      - name: Run unit tests
        working-directory: ${{ env.API_DIR }}
        run: pnpm test

      - name: Build NestJS application
        working-directory: ${{ env.API_DIR }}
        run: pnpm build

      - name: Build Docker image
        run: docker build --tag "$CI_IMAGE" "$API_DIR"

      - name: Report HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.CI_IMAGE }}
          format: table
          severity: HIGH,CRITICAL
          scanners: vuln
          ignore-unfixed: false
          exit-code: "0"

      - name: Block CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.CI_IMAGE }}
          format: table
          severity: CRITICAL
          scanners: vuln
          ignore-unfixed: false
          exit-code: "1"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false

      - name: Check Terraform formatting
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform fmt -check -recursive

      - name: Validate Terraform roots
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          for root in bootstrap environments/dev environments/prod; do
            terraform -chdir="$root" init -backend=false -input=false -no-color
            terraform -chdir="$root" validate -no-color
          done
